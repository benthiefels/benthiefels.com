backend:
  name: git-gateway
  branch: main

media_folder: "photos"
public_folder: "photos"

collections:
  # ==========================================
  # SITE SETTINGS (single file)
  # ==========================================
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        fields:
          - { name: "siteTitle", label: "Browser Tab Title", widget: "string" }
          - { name: "calendlyUrl", label: "Calendly URL", widget: "string" }
          - { name: "linkedinUrl", label: "LinkedIn URL", widget: "string" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { name: "tag", label: "Availability Tag (e.g. 'Available for Q2 2026')", widget: "string" }
              - { name: "headlinePart1", label: "Headline Part 1", widget: "string" }
              - { name: "headlineEmphasis", label: "Headline Italic Word", widget: "string" }
              - { name: "headlinePart2", label: "Headline Part 2", widget: "string" }
              - { name: "subtext", label: "Subtext", widget: "text" }
              - { name: "ctaPrimary", label: "Primary Button Text", widget: "string" }
              - { name: "ctaSecondary", label: "Secondary Button Text", widget: "string" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "paragraph1", label: "Paragraph 1 (supports <strong> tags)", widget: "text" }
              - { name: "paragraph2", label: "Paragraph 2", widget: "text" }
              - { name: "paragraph3", label: "Paragraph 3", widget: "text" }
              - { name: "stat1Number", label: "Stat 1 Number", widget: "string" }
              - { name: "stat1Label", label: "Stat 1 Label", widget: "string" }
              - { name: "stat2Number", label: "Stat 2 Number", widget: "string" }
              - { name: "stat2Label", label: "Stat 2 Label", widget: "string" }
              - { name: "stat3Number", label: "Stat 3 Number", widget: "string" }
              - { name: "stat3Label", label: "Stat 3 Label", widget: "string" }

          - label: "Where I Fit In Section"
            name: "icp"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "industries", label: "Industries (comma separated)", widget: "string" }
              - { name: "subtitle", label: "Subtitle", widget: "string" }
              - { name: "card1Title", label: "Card 1 Title", widget: "string" }
              - { name: "card1Detail", label: "Card 1 Detail", widget: "string" }
              - { name: "card1Items", label: "Card 1 Items (one per line)", widget: "text" }
              - { name: "card2Title", label: "Card 2 Title", widget: "string" }
              - { name: "card2Detail", label: "Card 2 Detail", widget: "string" }
              - { name: "card2Items", label: "Card 2 Items (one per line)", widget: "text" }

          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "subtitle", label: "Subtitle", widget: "text" }
              - { name: "col1Icon", label: "Column 1 Icon (emoji)", widget: "string" }
              - { name: "col1Title", label: "Column 1 Title", widget: "string" }
              - { name: "col1Items", label: "Column 1 Items (one per line)", widget: "text" }
              - { name: "col2Icon", label: "Column 2 Icon (emoji)", widget: "string" }
              - { name: "col2Title", label: "Column 2 Title", widget: "string" }
              - { name: "col2Items", label: "Column 2 Items (one per line)", widget: "text" }
              - { name: "col3Icon", label: "Column 3 Icon (emoji)", widget: "string" }
              - { name: "col3Title", label: "Column 3 Title", widget: "string" }
              - { name: "col3Items", label: "Column 3 Items (one per line)", widget: "text" }

          - label: "Engagements Section"
            name: "engagements"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }

          - label: "Testimonials Section"
            name: "testimonialSection"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }

          - label: "Work Section"
            name: "workSection"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }

          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { name: "sectionTag", label: "Section Tag", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "subtitle", label: "Subtitle", widget: "text" }
              - { name: "buttonText", label: "Button Text", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { name: "text", label: "Footer Text", widget: "string" }

      # LOGO BAR
      - name: "logos"
        label: "Client Logos"
        file: "content/logos.json"
        fields:
          - name: "logos"
            label: "Logos"
            label_singular: "Logo"
            widget: "list"
            fields:
              - { name: "src", label: "Logo File Path (e.g. logos/Zeta.svg)", widget: "string" }
              - { name: "alt", label: "Company Name", widget: "string" }

  # ==========================================
  # ENGAGEMENT CARDS
  # ==========================================
  - name: "engagements"
    label: "Engagement Types"
    label_singular: "Engagement"
    folder: "content/engagements"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.order}}-{{fields.name | slug}}"
    sortable_fields: ["order"]
    fields:
      - { name: "order", label: "Display Order", widget: "number", value_type: "int" }
      - { name: "icon", label: "Icon (emoji)", widget: "string" }
      - { name: "iconColor", label: "Icon Color", widget: "select", options: ["orange", "blue", "green"] }
      - { name: "name", label: "Name", widget: "string" }
      - { name: "whatItIs", label: "What It Is", widget: "text" }
      - { name: "howItWorks", label: "How It Works", widget: "text" }
      - { name: "bestFor", label: "Best For", widget: "text" }
      - { name: "costLabel", label: "Cost Label (e.g. Average, Pricing, One-time project)", widget: "string" }
      - { name: "costValue", label: "Cost Value", widget: "string" }
      - { name: "costNote", label: "Cost Note (optional, e.g. '3 month contract required')", widget: "string", required: false }

  # ==========================================
  # TESTIMONIALS
  # ==========================================
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "content/testimonials"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.order}}-{{fields.name | slug}}"
    sortable_fields: ["order"]
    fields:
      - { name: "order", label: "Display Order", widget: "number", value_type: "int" }
      - { name: "featured", label: "Featured (shown above the fold)", widget: "boolean", default: false }
      - { name: "headline", label: "Pull Quote Headline", widget: "string" }
      - { name: "quote", label: "Full Testimonial", widget: "text" }
      - { name: "name", label: "Person's Name", widget: "string" }
      - { name: "role", label: "Title & Company", widget: "string" }
      - { name: "photo", label: "Headshot", widget: "image" }

  # ==========================================
  # WORK / PORTFOLIO
  # ==========================================
  - name: "work"
    label: "Selected Work"
    label_singular: "Work Item"
    folder: "content/work"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.order}}-{{fields.title | slug}}"
    sortable_fields: ["order"]
    fields:
      - { name: "order", label: "Display Order", widget: "number", value_type: "int" }
      - name: "category"
        label: "Category"
        widget: "select"
        options:
          - { label: "Top of Funnel", value: "content" }
          - { label: "Web Design", value: "web" }
          - { label: "Videos", value: "video" }
          - { label: "Pitch Decks", value: "decks" }
          - { label: "Datasheets", value: "datasheets" }
          - { label: "Case Studies", value: "casestudies" }
      - { name: "categoryLabel", label: "Category Display Label", widget: "string" }
      - { name: "categoryIcon", label: "Category Icon (symbol)", widget: "string" }
      - { name: "title", label: "Title", widget: "string" }
      - { name: "url", label: "Link URL", widget: "string" }
